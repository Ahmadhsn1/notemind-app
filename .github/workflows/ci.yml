name: CI

on:
  push:
    branches: [main]
  pull_request:

# client/ and server/ are independent npm projects with no workspace tooling,
# so they get independent jobs rather than one job cd-ing between them.
jobs:
  client:
    name: Client (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      # VITE_API_URL is inlined at build time. Setting a placeholder here
      # proves the build works; the real value comes from Vercel's build
      # environment. vite.config.js fails the build if it's missing, so a
      # bundle can never ship with the localhost fallback baked in.
      - run: npm run build
        env:
          VITE_API_URL: https://ci.placeholder.invalid/api

  server:
    name: Server (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # mongodb-memory-server downloads a mongod binary on first run; caching
      # it keeps CI from re-fetching ~70MB on every push. Version is pinned in
      # tests/setup.js (8.x needs macOS 14+, which breaks local runs).
      - name: Cache mongodb-memory-server binary
        uses: actions/cache@v4
        with:
          path: server/node_modules/.cache/mongodb-memory-server
          key: mongo-binary-${{ runner.os }}-7.0.14
      - run: npm test   # 173 tests, in-memory MongoDB

  docker:
    name: Server image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./server
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
